[package]
name = "base-scheduler-native"
version = "0.4.0"
edition = "2024"
rust-version = "1.87"
license = "MIT"
repository = "https://github.com/base-rs/base-scheduler"
description = "Native work-stealing scheduler with readiness I/O and batched timers"
readme = "readme.md"

[features]
# Count and classify stall rescues through `NativeScheduler::rescue_statistics`. Not a stable interface.
diagnostics = []

[dependencies]
base-scheduler-selector = { path = "../selector", version = "0.4.0" }
base-scheduler = { path = "../..", version = "0.4.0" }
event-listener = "5.4.2"
async-task = "4.7.1"
crossbeam-deque = "0.8.7"
base-scheduler-timers = { path = "../timers", version = "0.4.0", features = ["local"] }

[dev-dependencies]
futures-channel = "0.3.31"
socket2 = { version = "0.6.3", features = ["all"] }
base-scheduler-conformance = { path = "../conformance", version = "0.4.0" }
futures-lite = "2.6.1"
tempfile = "3"
allocation-counter = "0.8.1"

[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Memory"] }

[target.'cfg(unix)'.dev-dependencies]
libc = "0.2"
