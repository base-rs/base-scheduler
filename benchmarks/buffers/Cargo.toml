[package]
name = "base-scheduler-buffer-benchmark"
version = "0.0.0"
edition = "2024"
rust-version = "1.87"
publish = false

[dependencies]
base-scheduler = { path = "../.." }
base-scheduler-direct = { path = "../../crates/direct" }
base-scheduler-tokio = { path = "../../crates/tokio" }
base-scheduler-native = { path = "../../crates/native" }
futures-lite = "2.6.1"
serde_json = "1"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "time", "macros", "test-util"] }
tempfile = "3"

[target.'cfg(target_os = "linux")'.dependencies]
base-scheduler-iouring = { path = "../../crates/iouring" }
io-uring = { version = "0.7.11", features = ["io_safety"] }
libc = "0.2"
