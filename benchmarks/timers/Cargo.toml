[package]
name = "base-scheduler-timer-benchmark"
version = "0.0.0"
edition = "2024"
rust-version = "1.87"
publish = false

[dependencies]
base-scheduler = { path = "../.." }
base-scheduler-direct = { path = "../../crates/direct" }
base-scheduler-tokio = { path = "../../crates/tokio" }
base-scheduler-native = { path = "../../crates/native" }
futures-lite = "2.6.1"
serde_json = "1"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "time", "macros", "test-util"] }
allocation-counter = "0.8.1"

[target.'cfg(target_os = "linux")'.dependencies]
base-scheduler-iouring = { path = "../../crates/iouring" }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
base-scheduler-timers = { path = "../../crates/timers", features = ["local"] }
