[package]
name = "base-scheduler-benchmark-timers"
version = "0.0.0"
edition = "2024"
rust-version = "1.87"
publish = false

[features]
# Count allocations for the `alloc` workload. This replaces the global allocator with a counting one, which slows every allocation, so build timed variants without it.
allocations = ["dep:allocation-counter"]
# Report stall rescue counts for Native runs, through `base-scheduler-native`'s `diagnostics` feature. Build timed variants without it.
diagnostics = ["base-scheduler-native/diagnostics"]

[dependencies]
allocation-counter = { version = "0.8.1", optional = true }
# Records and `Interval` only; the runner is not linked into the measured binary.
base-benchmark = { version = "0.2.0", default-features = false }
base-scheduler = { path = "../.." }
base-scheduler-tokio = { path = "../../crates/tokio" }
base-scheduler-native = { path = "../../crates/native" }
futures-lite = "2.6.1"
serde_json = "1"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "time", "macros", "test-util"] }

[target.'cfg(target_os = "linux")'.dependencies]
base-scheduler-iouring = { path = "../../crates/iouring" }

[dev-dependencies]
base-scheduler-timers = { path = "../../crates/timers", features = ["local"] }

# The runner, for the test that smokes every scenario through the shared collector. It supports Unix and is tested on Linux.
[target.'cfg(target_os = "linux")'.dev-dependencies]
base-benchmark = "0.2.0"
tempfile = "3.27.0"

# Scenarios for `cargo bake benchmark:*` and the `base-benchmark` command. Iteration counts are in `measure-arguments`, so that smoke runs replace them. The timer scenarios compare the Tokio adapter, Native and Native over io_uring in each round; the root-thread scenarios measure Native only.
[package.metadata.base-benchmark]
smoke-arguments = ["--iterations", "2"]
variants = [
    { name = "tokio", arguments = ["--backend", "tokio"] },
    { name = "native", arguments = ["--backend", "native"] },
    { name = "iouring", arguments = ["--backend", "iouring"] },
]

[[package.metadata.base-benchmark.scenario]]
name = "refresh"
arguments = ["--workload", "refresh", "--mode", "reuse"]
measure-arguments = ["--iterations", "3000000"]

[[package.metadata.base-benchmark.scenario]]
name = "refresh-sleep"
arguments = ["--workload", "refresh", "--mode", "sleep"]
measure-arguments = ["--iterations", "3000000"]

[[package.metadata.base-benchmark.scenario]]
name = "fixed"
arguments = ["--workload", "fixed", "--mode", "reuse"]
measure-arguments = ["--iterations", "3000000"]

[[package.metadata.base-benchmark.scenario]]
name = "earlier"
arguments = ["--workload", "earlier", "--mode", "reuse"]
measure-arguments = ["--iterations", "3000000"]

[[package.metadata.base-benchmark.scenario]]
name = "yield"
arguments = ["--workload", "yield", "--mode", "reuse"]
measure-arguments = ["--iterations", "1500000"]

[[package.metadata.base-benchmark.scenario]]
name = "yield-contended"
arguments = ["--workload", "yield", "--mode", "reuse", "--tasks", "64", "--workers", "4"]
measure-arguments = ["--iterations", "75000"]

[[package.metadata.base-benchmark.scenario]]
name = "expire"
arguments = ["--workload", "expire", "--mode", "sleep"]
measure-arguments = ["--iterations", "300"]

[[package.metadata.base-benchmark.scenario]]
name = "expire-contended"
arguments = ["--workload", "expire", "--mode", "sleep", "--tasks", "128", "--workers", "4"]
measure-arguments = ["--iterations", "200"]

[[package.metadata.base-benchmark.scenario]]
name = "cycle"
arguments = ["--workload", "cycle", "--mode", "reuse", "--tasks", "64", "--workers", "4"]
measure-arguments = ["--iterations", "200"]

[[package.metadata.base-benchmark.scenario]]
name = "spawn"
arguments = ["--workload", "spawn", "--workers", "4"]
measure-arguments = ["--iterations", "100000"]
variants = []

[[package.metadata.base-benchmark.scenario]]
name = "spawn-pending"
arguments = ["--workload", "spawn-pending", "--workers", "4"]
measure-arguments = ["--iterations", "100000"]
variants = []

[[package.metadata.base-benchmark.scenario]]
name = "root-sleep"
arguments = ["--workload", "root-sleep", "--workers", "4"]
measure-arguments = ["--iterations", "1000"]
variants = []

[[package.metadata.base-benchmark.scenario]]
name = "task-sleep"
arguments = ["--workload", "task-sleep", "--workers", "4"]
measure-arguments = ["--iterations", "1000"]
variants = []

[[package.metadata.base-benchmark.scenario]]
name = "task-yield"
arguments = ["--workload", "task-yield", "--workers", "4"]
measure-arguments = ["--iterations", "100000"]
variants = []

[[package.metadata.base-benchmark.scenario]]
name = "idle"
arguments = ["--workload", "idle", "--workers", "4"]
measure-arguments = ["--iterations", "1000"]
variants = []

[[package.metadata.base-benchmark.scenario]]
name = "pulse"
arguments = ["--workload", "pulse", "--workers", "4"]
smoke-arguments = ["--iterations", "1", "--unit-us", "10"]
measure-arguments = ["--iterations", "3"]
variants = []

[[package.metadata.base-benchmark.scenario]]
name = "stall"
arguments = ["--workload", "stall", "--workers", "4"]
smoke-arguments = ["--iterations", "1", "--unit-us", "100"]
measure-arguments = ["--iterations", "10"]
variants = []

# The worker-local timer diagnostic: 1,024 tasks each sleeping 1 ms again and again, over a 3-second window.
[[package.metadata.base-benchmark.scenario]]
name = "periodic"
arguments = ["--workload", "periodic", "--workers", "4"]
smoke-arguments = ["--measure-ms", "30"]
variants = [
    { name = "native", arguments = ["--backend", "native"] },
    { name = "iouring", arguments = ["--backend", "iouring"] },
]

[[package.metadata.base-benchmark.scenario]]
name = "periodic-aligned"
arguments = ["--workload", "periodic", "--workers", "4", "--alignment", "aligned"]
smoke-arguments = ["--measure-ms", "30"]
variants = [
    { name = "native", arguments = ["--backend", "native"] },
    { name = "iouring", arguments = ["--backend", "iouring"] },
]

# Allocation counts need the counting allocator, so this scenario runs its own build, never reaching the timed ones.
[[package.metadata.base-benchmark.scenario]]
name = "alloc"
arguments = ["--workload", "alloc", "--mode", "reuse"]
measure-arguments = ["--iterations", "100000"]
features = ["allocations"]

# Stall rescue counts, from a `diagnostics` build. `stall` is the control, which must record rescues; the periodic diagnostics recorded them in most runs.
[[package.metadata.base-benchmark.scenario]]
name = "stall-rescues"
arguments = ["--workload", "stall", "--workers", "4"]
smoke-arguments = ["--iterations", "1", "--unit-us", "100"]
measure-arguments = ["--iterations", "10"]
variants = []
features = ["diagnostics"]

[[package.metadata.base-benchmark.scenario]]
name = "periodic-rescues"
arguments = ["--workload", "periodic", "--workers", "4"]
smoke-arguments = ["--measure-ms", "30"]
variants = [
    { name = "native", arguments = ["--backend", "native"] },
    { name = "iouring", arguments = ["--backend", "iouring"] },
]
features = ["diagnostics"]

[[package.metadata.base-benchmark.scenario]]
name = "periodic-aligned-rescues"
arguments = ["--workload", "periodic", "--workers", "4", "--alignment", "aligned"]
smoke-arguments = ["--measure-ms", "30"]
variants = [
    { name = "native", arguments = ["--backend", "native"] },
    { name = "iouring", arguments = ["--backend", "iouring"] },
]
features = ["diagnostics"]
