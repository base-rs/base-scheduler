[package]
name = "base-scheduler-echo-benchmark"
version = "0.0.0"
edition = "2024"
rust-version = "1.85"
publish = false

[dependencies]
base-scheduler = { path = "../.." }
base-scheduler-tokio = { path = "../../crates/tokio" }
tokio = { version = "1.53.3", features = ["rt-multi-thread", "net", "io-util", "sync", "time"] }
serde_json = "1"
hdrhistogram = { version = "7.5", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
base-scheduler-native = { path = "../../crates/native" }
base-scheduler-iouring = { path = "../../crates/iouring" }
