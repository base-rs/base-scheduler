[package]
name = "base-scheduler-benchmark-echo"
version = "0.0.0"
edition = "2024"
rust-version = "1.87"
publish = false

[features]
# Report the server's stall rescue counts for Native backends, through `base-scheduler-native`'s `diagnostics` feature. Build timed variants without it.
diagnostics = ["base-scheduler-native/diagnostics"]

[dependencies]
base-scheduler = { path = "../.." }
base-scheduler-tokio = { path = "../../crates/tokio" }
tokio = { version = "1.53.3", features = ["rt-multi-thread", "net", "io-util", "sync", "time"] }
serde_json = "1"
hdrhistogram = { version = "7.5", default-features = false }
base-scheduler-native = { path = "../../crates/native" }

[target.'cfg(target_os = "linux")'.dependencies]
base-scheduler-iouring = { path = "../../crates/iouring" }
